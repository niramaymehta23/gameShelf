# Fly.io config for Sabha Games. See DEPLOY.md.
# `app` must be unique on Fly: change it if `fly launch` says the name is taken.
app = "sabha-games"
primary_region = "lhr"   # London; pick the region nearest the sabha (`fly platform regions`)

[build]

[env]
  PORT = "8080"
  DATA_DIR = "/data"

# rooms are saved here at the end of every round, so a restart keeps the scores
[[mounts]]
  source = "sabha_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # never stop by itself: stopping wipes a game in progress. Stop it yourself with `fly scale count 0`.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    soft_limit = 400
    hard_limit = 500

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
