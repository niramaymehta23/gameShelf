<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Our Game Shelf</title>
<meta name="description" content="Connect Four, Battleships and Hues for two, played on two phones wherever you both are.">
<meta name="theme-color" content="#5f7a97">
<meta name="color-scheme" content="light">

<!-- installable: Add to Home Screen on iPhone and Android -->
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Game Shelf">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caprasimo&family=Caveat:wght@500;700&family=Figtree:wght@500;600;700;800&display=swap">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div id="app">
  <header id="bar" hidden>
    <div class="bar-side" id="barLeft"></div>
    <div class="bar-mid">
      <div class="bar-title" id="barTitle"></div>
      <button class="presence" id="presence"><i class="dot" id="partnerDot"></i><span id="partnerName"></span></button>
    </div>
    <div class="bar-side right">
      <button class="icon-btn" id="chatBtn" aria-label="Chat and reactions"><i class="unread"></i></button>
      <button class="icon-btn" id="soundBtn" aria-label="Sound on or off"></button>
    </div>
  </header>
  <main id="stage"></main>
</div>
<div id="toast" aria-live="polite"></div>
<div id="chatfx" aria-live="polite"></div>
<div id="sheet" hidden></div>

<!-- Firebase (compat builds work as classic scripts), then our classic scripts sharing globals; the order matters. -->
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js" defer></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js" defer></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js" defer></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-check-compat.js" defer></script>
<script src="/js/firebase-config.js" defer></script>  <!-- generated, see tools/firebase-config.mjs -->
<script src="/js/util.js" defer></script>
<script src="/js/net.js" defer></script>
<script src="/js/app.js" defer></script>
<script src="/js/lobby.js" defer></script>
<script src="/js/rps.js" defer></script>
<script src="/js/connect4.js" defer></script>
<script src="/js/battleships.js" defer></script>
<script src="/js/hues.js" defer></script>
<script src="/js/boot.js" defer></script>
</body>
</html>
