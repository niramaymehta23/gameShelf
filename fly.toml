# Fly.io config. `fly launch --no-deploy` will ask for an app name; keep the rest.
app = "our-game-shelf"
primary_region = "lhr"

[build]

[env]
  DATA_FILE = "/data/db.json"
  PORT = "3000"

[[mounts]]
  source = "shelf_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  # one machine that stays up: the game state lives in this process and its volume
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "5s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "3s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
